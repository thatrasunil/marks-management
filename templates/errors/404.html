{% extends 'base.html' %}
{% block title %}Page Not Found - AITS Results{% endblock %}

{% block content %}
<div class="min-h-screen flex items-center justify-center bg-gray-50 px-4">
    <div class="max-w-md w-full text-center bg-white p-8 rounded-2xl shadow-xl border border-gray-100 transform hover:scale-105 transition-transform duration-300">
        <div class="w-24 h-24 bg-blue-50 text-primary rounded-full flex items-center justify-center mx-auto mb-6">
            <svg class="w-12 h-12" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.172 16.172a4 4 0 015.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
            </svg>
        </div>
        <h1 class="text-6xl font-heading font-bold text-primary mb-2">404</h1>
        <h2 class="text-2xl font-heading font-semibold text-gray-800 mb-4">Page Not Found</h2>
        <p class="text-gray-500 mb-8 leading-relaxed">
            The page you are looking for might have been removed, had its name changed, or is temporarily unavailable.
        </p>
        <div class="space-y-4">
            <a href="/" class="block w-full py-3 px-4 bg-secondary hover:bg-blue-700 text-white rounded-xl font-medium shadow-lg hover:shadow-blue-500/20 transition-all duration-300">
                Go to Homepage
            </a>
            <button onclick="window.history.back()" class="block w-full py-3 px-4 bg-gray-100 hover:bg-gray-200 text-gray-700 rounded-xl font-medium transition-colors duration-300">
                Go Back
            </button>
        </div>
    </div>
</div>
{% endblock %}
