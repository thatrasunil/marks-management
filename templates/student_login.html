{% extends 'base.html' %}
{% block title %}Student Result Portal{% endblock %}

{% block content %}
<div class="min-h-screen flex items-center justify-center relative">
    <!-- Academic Decorative Elements -->
    <div class="absolute top-0 left-0 w-full h-64 bg-primary rounded-b-[100px] z-0"></div>

    <div class="bg-white p-10 rounded-2xl shadow-2xl w-full max-w-lg border border-gray-100 z-10">
        <div class="text-center mb-10">
            <img src="{{ url_for('static', filename='logo.jpg') }}" alt="AITS Logo"
                class="mx-auto h-20 w-auto mb-4 rounded-lg shadow-sm">
            <h1 class="text-3xl font-heading text-primary font-bold">AITS Results</h1>
            <p class="text-gray-500 mt-2">Check your semester examination results</p>
        </div>

        <form method="POST" action="/student" class="space-y-6">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">Roll Number</label>
                <input type="text" name="roll_no" required
                    class="w-full px-4 py-3 border border-gray-200 rounded-xl focus:ring-2 focus:ring-secondary focus:border-secondary transition-colors text-lg uppercase"
                    placeholder="e.g. 24AK1A30F1">
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">Aadhar Number (Last 4 digits)</label>
                <input type="password" name="aadhar" required maxlength="4" pattern="\d{4}"
                    class="w-full px-4 py-3 border border-gray-200 rounded-xl focus:ring-2 focus:ring-secondary focus:border-secondary transition-colors text-center text-xl tracking-[1em]"
                    placeholder="••••">
            </div>

            <button type="submit"
                class="w-full bg-primary hover:bg-gray-800 text-white font-semibold py-4 rounded-xl transition-transform transform hover:-translate-y-1 mt-6 text-lg relative overflow-hidden group">
                <span class="relative z-10">Check Result</span>
                <div
                    class="absolute inset-0 h-full w-full bg-secondary transform scale-x-0 group-hover:scale-x-100 transition-transform origin-left duration-300">
                </div>
            </button>
        </form>

        <div class="mt-8 pt-6 border-t border-gray-100 text-center text-sm flex justify-center space-x-6 text-gray-500">
            <a href="/teacher/login" class="hover:text-secondary transition-colors">Faculty Login</a>
            <span>•</span>
            <a href="/admin/login" class="hover:text-secondary transition-colors">Admin Portal</a>
        </div>
    </div>
</div>
{% endblock %}
