{% extends 'base.html' %}
{% block title %}Admin Login{% endblock %}

{% block content %}
<div class="min-h-screen flex items-center justify-center">
    <div class="bg-white p-8 rounded-xl shadow-2xl w-full max-w-md border border-gray-100">
        <div class="text-center mb-8">
            <img src="{{ url_for('static', filename='logo.jpg') }}" alt="AITS Logo"
                class="mx-auto h-16 w-auto mb-4 rounded border border-gray-100">
            <h1 class="text-3xl font-heading text-primary bg-clip-text">AITS Results Admin</h1>
            <p class="text-gray-500 mt-2">Manage Results & Faculties</p>
        </div>

        <form method="POST" action="/admin/login" class="space-y-6">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Username</label>
                <input type="text" name="username" required
                    class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-secondary focus:border-secondary transition-colors"
                    placeholder="Enter admin username">
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
                <input type="password" name="password" required
                    class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-secondary focus:border-secondary transition-colors"
                    placeholder="••••••••">
            </div>

            <button type="submit"
                class="w-full bg-secondary hover:bg-blue-700 text-white font-semibold py-3 rounded-lg transition-transform transform hover:-translate-y-0.5 mt-4">
                Login to Dashboard
            </button>
        </form>

        <div class="mt-6 text-center text-sm">
            <a href="/" class="text-secondary hover:underline">← Back to Student Portal</a>
        </div>
    </div>
</div>
{% endblock %}
