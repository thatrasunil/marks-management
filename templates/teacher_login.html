{% extends 'base.html' %}
{% block title %}Teacher Login{% endblock %}

{% block content %}
<div class="min-h-screen flex items-center justify-center">
    <div class="bg-white p-8 rounded-xl shadow-2xl w-full max-w-md border border-gray-100">
        <div class="text-center mb-8">
            <div class="w-16 h-16 bg-primary rounded-full mx-auto mb-4 flex items-center justify-center shadow-lg">
                <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253">
                    </path>
                </svg>
            </div>
            <h1 class="text-3xl font-heading text-primary">Faculty Portal</h1>
            <p class="text-gray-500 mt-2">Enter student marks & assessments</p>
        </div>

        <form method="POST" action="/teacher/login" class="space-y-6">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Email Address</label>
                <input type="email" name="email" required
                    class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-secondary focus:border-secondary transition-colors"
                    placeholder="faculty@college.edu">
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
                <input type="password" name="password" required
                    class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-secondary focus:border-secondary transition-colors"
                    placeholder="••••••••">
            </div>

            <button type="submit"
                class="w-full bg-primary hover:bg-gray-800 text-white font-semibold py-3 rounded-lg transition-transform transform hover:-translate-y-0.5 mt-4">
                Login
            </button>
        </form>

        <div class="mt-6 text-center text-sm flex justify-between">
            <a href="/" class="text-secondary hover:underline">Student Portal</a>
            <a href="/admin/login" class="text-secondary hover:underline">Admin Login</a>
        </div>
    </div>
</div>
{% endblock %}
